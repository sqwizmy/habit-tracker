<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Трекер привычек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f7f8fa;--card:#fff;--tx:#1d1d22;--mut:#8b8b95;--ac:#ee6677;--soft:#fbe6e8;--line:#eee;--sh:0 6px 20px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#141417;--card:#202025;--tx:#f2f2f5;--mut:#9a9aa5;--soft:#3a2428;--line:#2e2e35;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,Roboto,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 14px;text-align:center}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:12px}
.week{display:flex;justify-content:space-between;margin-bottom:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:6px 2px;border-radius:24px;flex:1;cursor:pointer}
.day.sel{outline:1.5px solid var(--soft)}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;font-size:14px;color:var(--tx)}
.dot.full{background:var(--ac);border-color:var(--ac);color:#fff}
.dot.part{border-color:var(--ac)}
.dot.off{border-style:dashed;opacity:.5}
.h{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.h:active{transform:scale(.96)}
.h .e{font-size:24px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.h .n{flex:1;font-weight:600;min-width:0}
.h.on .n{text-decoration:line-through;opacity:.55}
.chk{min-width:32px;height:32px;padding:0 6px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;color:var(--mut);font-weight:700;font-size:13px}
.h.on .chk{border:0;color:#fff;animation:checkPop .35s ease}
.ed{border:0;background:none;color:var(--mut);font-size:18px;padding:4px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:35px 20px}
.empty b{display:block;font-size:48px;margin-bottom:8px}
.btn{border:0;border-radius:18px;padding:13px 18px;font:600 15px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,#ee6677,#e9728f);cursor:pointer;transition:transform .15s ease,filter .15s ease}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:var(--soft);color:var(--ac)}
.btn.w{width:100%;margin-top:8px}
nav{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:500px;margin:auto;background:var(--card);border-radius:30px;display:flex;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:5}
nav button{flex:1;border:0;background:none;font-size:19px;padding:10px 0;border-radius:24px;filter:grayscale(1);opacity:.55;cursor:pointer;transition:transform .15s ease,background .2s ease}
nav button:active{transform:scale(.9)}
nav button.on{background:var(--soft);filter:none;opacity:1}
.moods{display:flex;justify-content:space-between}
.moods button{border:2px solid transparent;background:var(--bg);border-radius:50%;width:48px;height:48px;font-size:25px;cursor:pointer;transition:transform .2s ease}
.moods button:active{transform:scale(.9)}
.moods button.on{border-color:var(--ac);background:var(--soft)}
.mrow{display:flex;justify-content:space-between;margin-top:12px;text-align:center;font-size:12px;color:var(--mut)}
.mrow div{flex:1}
.mrow span{display:block;font-size:22px;min-height:30px}
.quote{border-radius:20px;padding:30px 18px;text-align:center;color:#fff;font-size:18px;font-weight:600;background:linear-gradient(135deg,#9fd0e6,#f0a8b8);text-shadow:0 2px 8px #0003}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ava{width:62px;height:62px;border-radius:50%;border:3px solid #f1cf7a;background:var(--soft);display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none;cursor:pointer}
.ava img{width:100%;height:100%;object-fit:cover}
.ring{width:160px;height:160px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--soft) 0)}
.ring div{width:130px;height:130px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.ring b{font-size:32px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.stats b{font-size:26px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dot{width:100%;height:auto;aspect-ratio:1;font-size:13px;cursor:pointer}
.cal .out{opacity:.3}
.navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:600}
.navrow button{border:0;background:var(--soft);color:var(--ac);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.grid{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px}
td,th{text-align:center;padding:0}
th{color:var(--mut);font-weight:500}
td.nm{text-align:left;white-space:nowrap;padding-right:6px}
.c{min-width:27px;height:28px;border-radius:8px;background:var(--line);cursor:pointer;display:grid;place-items:center;font-size:11px;color:#fff}
.sheet{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:10}
.sheet>div{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
input[type=text],select{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--tx);border-radius:16px;padding:12px 14px;font:inherit;margin:6px 0}
.pre{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.pre button{border:2px solid var(--line);background:var(--bg);color:var(--tx);border-radius:14px;padding:8px 11px;font:inherit;cursor:pointer}
.pre button.on{border-color:var(--ac);background:var(--soft)}
.pre .sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid transparent}
.pre .sw.on{border-color:var(--tx)}
.step{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--ac);font-size:20px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.pet{text-align:center;padding:18px 10px}
.petface{font-size:76px;line-height:1.2;margin:8px;animation:petFloat 2s ease-in-out infinite}
.petbar{height:10px;background:var(--line);border-radius:20px;overflow:hidden;margin:12px 0}
.petbar i{display:block;height:100%;background:linear-gradient(90deg,#f4b45e,#ee6677);border-radius:20px;transition:width .5s ease}
.ach{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border:0}
.achico{width:48px;height:48px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:25px;flex:none}
.ach.lock{opacity:.48}
.ach b{display:block}
.tag{font-size:11px;color:var(--ac);font-weight:700}
#adBanner{display:none;position:sticky;top:0;z-index:20;max-width:520px;margin:0 auto;background:var(--card);color:var(--tx);padding:10px 14px;text-align:center;border-bottom:1px solid var(--line);font-size:13px}
#adBanner a{color:#ee6677;font-weight:700;text-decoration:none;margin-left:6px}
#gate{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);padding:24px;align-items:center;justify-content:center;text-align:center}
#gate .gatebox{width:100%;max-width:420px;background:var(--card);padding:26px 20px;border-radius:24px;box-shadow:var(--sh)}
#gate .gateicon{font-size:56px;margin-bottom:12px}
#gate p{color:var(--mut);line-height:1.55}
#gate a{display:block;text-decoration:none;margin:16px 0}
#gate button{width:100%;margin-top:8px}

/* Плавное появление экранов */
.screen-enter{animation:screenEnter .32s ease both}
@keyframes screenEnter{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:translateY(0)}
}

/* Анимация галочки */
@keyframes checkPop{
  0%{transform:scale(.45)}
  65%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* Плавающий питомец */
@keyframes petFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

/* Получение опыта питомцем */
.petface.xp-pop{animation:petXp .55s ease}
@keyframes petXp{
  0%{transform:scale(1)}
  35%{transform:scale(1.2) rotate(-8deg)}
  70%{transform:scale(1.12) rotate(8deg)}
  100%{transform:scale(1)}
}

/* Повышение уровня питомца */
.petface.level-pop{animation:petLevel .85s ease}
@keyframes petLevel{
  0%{transform:scale(1)}
  30%{transform:scale(1.35) rotate(-12deg)}
  60%{transform:scale(1.3) rotate(12deg)}
  100%{transform:scale(1)}
}

/* Конфетти */
.confetti{
  position:fixed;
  top:-15px;
  width:9px;
  height:13px;
  z-index:9999;
  pointer-events:none;
  animation:confettiFall 1.8s ease-in forwards;
}
@keyframes confettiFall{
  to{transform:translateY(105vh) rotate(720deg);opacity:0}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="adBanner">
  📢 Подписывайся на мой Telegram-канал!
  <a href="https://t.me/focus_iron" target="_blank" rel="noopener">@focus_iron</a>
</div>

<div id="gate">
  <div class="gatebox">
    <div class="gateicon">📢</div>
    <h1>Подпишись на канал!</h1>
    <p>Поддержи проект! Подписывайся на мой Telegram-канал @focus_iron.</p>
    <a href="https://t.me/focus_iron" target="_blank" rel="noopener">
      <button class="btn">Подписаться на канал</button>
    </a>
    <button class="btn ghost" id="continueBtn">Продолжить</button>
  </div>
</div>

<div id="app"></div>
<nav id="nav"></nav>

<script>
const tg=window.Telegram?.WebApp;
try{if(tg){tg.ready();tg.expand()}}catch(e){}

function showRuntimeError(message){
  let box=document.getElementById('runtimeError');
  if(!box){
    box=document.createElement('div');
    box.id='runtimeError';
    box.style.cssText='position:fixed;inset:0;z-index:9999;background:#fff;color:#222;padding:24px;font:15px/1.5 system-ui;overflow:auto';
    document.body.appendChild(box);
  }
  box.innerHTML='<h2>Не удалось запустить приложение</h2><p></p><p>Скопируйте текст ошибки и отправьте разработчику.</p>';
  box.querySelector('p').textContent=String(message);
}
window.onerror=(m,u,l)=>{showRuntimeError(String(m)+' (строка '+l+')');return true};
window.addEventListener('unhandledrejection',e=>showRuntimeError(e.reason?.message||e.reason||'Неизвестная ошибка'));

const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const PRESETS=[['🚶','Прогулка',1],['💧','Пить воду',8],['🧘','Медитация',1],['🏃','Бег',1],['💪','Тренировка',1],['🛏️','Спать вовремя',1],['📖','Читать',1],['🍳','Завтрак',1],['🚴','Велосипед',1]];
const COLORS=['#7adfba','#e9a9a9','#b7d3e0','#d985b8','#5dbde0','#e3a75f','#f4c97b','#ee6677'];
const MOODS=['😞','😕','😐','🙂','😄'];
const QUOTES=['Маленький шаг каждый день — это уже путь','Сегодня лучше, чем вчера','Дисциплина — это забота о себе','Не идеально, а регулярно','Ты уже сделал больше, чем думаешь','Начни там, где стоишь','Привычки строят характер','Один день — одна победа','Прогресс важнее скорости','Отдых — тоже часть плана','Верь процессу'];

const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{let d=new Date();d.setHours(0,0,0,0);return d},add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},wd=d=>(d.getDay()+6)%7,mon=d=>add(d,-wd(d));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

let S={habits:[],log:{},mood:{},name:'',avatar:'',pet:{name:'Пешка',level:1,xp:0,lastDate:'',done:[]}},tab='home',sel=today(),calM=today(),weekStart=mon(today()),fh='all';

const KEY='habits_v2',CH=3000;

/* Звуковые эффекты */
let soundEnabled=true;
try{soundEnabled=localStorage.getItem('habit_sound')!=='off'}catch(e){}
let audioContext=null;

function playSound(type='tap'){
  if(!soundEnabled)return;
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    audioContext=audioContext||new AudioCtx();
    if(audioContext.state==='suspended')audioContext.resume();

    const sounds={
      tap:{freq:440,duration:.055,volume:.045},
      success:{freq:660,duration:.16,volume:.09},
      reward:{freq:880,duration:.25,volume:.1},
      level:{freq:1040,duration:.3,volume:.1}
    };
    const s=sounds[type]||sounds.tap;
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    const now=audioContext.currentTime;

    osc.type='sine';
    osc.frequency.setValueAtTime(s.freq,now);
    if(type==='reward'||type==='level'){
      osc.frequency.setValueAtTime(s.freq*1.25,now+.09);
    }
    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(s.volume,now+.018);
    gain.gain.exponentialRampToValueAtTime(.0001,now+s.duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now+s.duration);
  }catch(e){}
}

function toggleSound(){
  soundEnabled=!soundEnabled;
  try{localStorage.setItem('habit_sound',soundEnabled?'on':'off')}catch(e){}
  if(soundEnabled)playSound('success');
  render();
  note(soundEnabled?'🔊 Звуки включены':'🔇 Звуки выключены');
}

/* Звук для нажатий на кнопки */
document.addEventListener('click',e=>{
  const button=e.target.closest('button');
  if(button&&!button.disabled)playSound('tap');
},true);

/* Конфетти при достижении */
function celebrate(){
  playSound('reward');
  const colors=COLORS;
  for(let i=0;i<45;i++){
    const piece=document.createElement('div');
    piece.className='confetti';
    piece.style.left=Math.random()*100+'vw';
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay=Math.random()*.5+'s';
    piece.style.borderRadius=Math.random()>.5?'50%':'2px';
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),2500);
  }
}

function cloud(){try{return tg&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null}catch(e){return null}}
function save(){
  let v=JSON.stringify(S);
  try{localStorage.setItem(KEY,v)}catch(e){}
  let cs=cloud();if(!cs)return;
  try{let n=Math.ceil(v.length/CH);for(let i=0;i<n;i++)cs.setItem(KEY+i,v.slice(i*CH,(i+1)*CH));cs.setItem(KEY+'n',String(n))}catch(e){}
}
function load(cb){
  let local='';try{local=localStorage.getItem(KEY)||''}catch(e){}
  let cs=cloud(),done=false;
  const fin=v=>{if(done)return;done=true;try{if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}cb()};
  if(!cs)return fin(local);
  setTimeout(()=>fin(local),2500);
  try{cs.getItem(KEY+'n',(e,n)=>{
    n=+n;if(!n)return fin(local);
    let keys=Array.from({length:n},(_,i)=>KEY+i);
    cs.getItems(keys,(e2,o)=>fin(o?keys.map(k=>o[k]||'').join(''):local))
  })}catch(e){fin(local)}
}

const buzz=t=>tg?.HapticFeedback?.impactOccurred(t||'light');
const cnt=(k,id)=>(S.log[k]||{})[id]||0,active=(h,d)=>h.days.includes(wd(d)),ok=(k,h)=>cnt(k,h.id)>=h.goal;

function setCnt(k,id,n){
  let o=S.log[k]||(S.log[k]={});
  if(n>0)o[id]=n;else delete o[id];
  if(!Object.keys(o).length)delete S.log[k]
}

function tap(k,id){
  let h=S.habits.find(x=>x.id===id);
  if(!h)return;

  const before=ACH.filter(a=>a.val()>=a.goal).map(a=>a.id);
  let c=cnt(k,id);
  let completedNow=c<h.goal&&c+1>=h.goal;

  setCnt(k,id,c>=h.goal?0:c+1);

  const after=ACH.filter(a=>a.val()>=a.goal);
  const newAchievements=after.filter(a=>!before.includes(a.id));

  playSound(completedNow?'success':'tap');

  if(newAchievements.length){
    celebrate();
    setTimeout(()=>note('🏆 Новое достижение!\n\n'+newAchievements.map(a=>a.icon+' '+a.name).join('\n')),350);
  }

  save();
  buzz(completedNow?'medium':'light');
  render();
}

function dayState(d,only){
  let k=fmt(d),hs=S.habits.filter(h=>active(h,d)&&(!only||only==='all'||h.id===only));
  if(!hs.length)return -1;
  let n=hs.filter(h=>ok(k,h)).length;
  return n===hs.length?2:hs.some(h=>cnt(k,h.id)>0)?1:0
}
const cls=s=>s===2?'full':s===1?'part':s===-1?'off':'';

function streak(h){
  let n=0,d=today(),first=true;
  for(let i=0;i<730;i++,first=false){
    if(active(h,d)){if(ok(fmt(d),h))n++;else if(!first)break}
    d=add(d,-1)
  }
  return n
}
function bestStreak(only){
  let hs=S.habits.filter(h=>only==='all'||h.id===only),best=0;
  hs.forEach(h=>{
    let c=0,d=add(today(),-730);
    for(let i=0;i<=730;i++,d=add(d,1)){
      if(!active(h,d))continue;
      if(ok(fmt(d),h)){c++;best=Math.max(best,c)}else c=0
    }
  });
  return best
}
function completed(){
  let n=0;
  Object.entries(S.log).forEach(([k,o])=>Object.entries(o).forEach(([id,c])=>{
    let h=S.habits.find(x=>x.id===id);if(h&&c>=h.goal)n++
  }));
  return n
}
function perfectDays(){
  let n=0;
  Object.keys(S.log).forEach(k=>{if(dayState(new Date(k+'T00:00:00'))===2)n++});
  return n
}

const ACH=[
{id:'first',icon:'🌱',name:'Первый шаг',desc:'Выполни первую привычку',goal:1,val:()=>completed()},
{id:'five',icon:'⭐',name:'Начало положено',desc:'Выполни 5 привычек',goal:5,val:()=>completed()},
{id:'ten',icon:'🔥',name:'В ритме',desc:'Выполни 10 привычек',goal:10,val:()=>completed()},
{id:'thirty',icon:'🏅',name:'Настойчивость',desc:'Выполни 30 привычек',goal:30,val:()=>completed()},
{id:'hundred',icon:'👑',name:'Легенда привычек',desc:'Выполни 100 привычек',goal:100,val:()=>completed()},
{id:'streak3',icon:'📅',name:'Три дня подряд',desc:'Серия выполнения — 3 дня',goal:3,val:()=>Math.max(0,...S.habits.map(streak))},
{id:'streak7',icon:'🗓️',name:'Целая неделя',desc:'Серия выполнения — 7 дней',goal:7,val:()=>Math.max(0,...S.habits.map(streak))},
{id:'streak30',icon:'💎',name:'Месяц силы',desc:'Серия выполнения — 30 дней',goal:30,val:()=>Math.max(0,...S.habits.map(streak))},
{id:'perfect1',icon:'✨',name:'Идеальный день',desc:'Выполни все привычки за день',goal:1,val:()=>perfectDays()},

function weekStrip(){
  let m=mon(sel);
  return '<div class="week">'+Array.from({length:7},(_,i)=>{

    return `<div class="day ${fmt(d)===fmt(sel)?'sel':''}" onclick="pick('${fmt(d)}')">${DAYS[i]}<div class="dot ${cls(dayState(d))}">${d.getDate()}</div></div>`

function changeAvatar(){
  let input=document.createElement('input');input.type='file';input.accept='image/*';
  input.onchange=()=>{
    let f=input.files?.[0];if(!f)return;
    if(!f.type.startsWith('image/'))return note('Выберите изображение');
    let r=new FileReader();
    r.onload=()=>{
      let im=new Image();
      im.onload=()=>{
        let c=document.createElement('canvas');c.width=c.height=256;
        let x=c.getContext('2d'),side=Math.min(im.width,im.height);
        x.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,256,256);
        S.avatar=c.toDataURL('image/jpeg',.8);save();render();note('Аватарка изменена!')
      };
      im.src=r.result
    };
    r.readAsDataURL(f)
  };
  input.click()
}

function detailedStats(){
  const now=today(),y=calM.getFullYear(),m=calM.getMonth(),monthEnd=new Date(y,m+1,0);
  let total=0,completedCount=0,activeDays=0,perfect=0;
  const selectedHabits=S.habits.filter(h=>fh==='all'||h.id===fh);
  const habitStats=selectedHabits.map(h=>{
    let planned=0,done=0;
    for(let d=1;d<=monthEnd.getDate();d++){
      const date=new Date(y,m,d);if(date>now)break;if(!active(h,date))continue;
      planned++;if(ok(fmt(date),h))done++;
    }
    total+=planned;completedCount+=done;
    return {name:h.name,emoji:h.emoji,planned,done,percent:planned?Math.round(done/planned*100):0,streak:streak(h)};
  });
  for(let d=1;d<=monthEnd.getDate();d++){
    const date=new Date(y,m,d);if(date>now)break;
    const state=dayState(date,fh);if(state===1||state===2)activeDays++;if(state===2)perfect++;
  }
  return {total,completedCount,missed:Math.max(0,total-completedCount),activeDays,perfect,percent:total?Math.round(completedCount/total*100):0,habitStats};
}

const PET_TASKS=[{id:'feed',icon:'🥕',name:'Покормить питомца',desc:'Позаботься о его энергии',xp:20},{id:'play',icon:'🎾',name:'Поиграть вместе',desc:'Немного веселья каждый день',xp:20},{id:'walk',icon:'🌳',name:'Прогуляться',desc:'Время для свежего воздуха',xp:30},{id:'train',icon:'🧠',name:'Потренироваться',desc:'Выучи с питомцем что-нибудь новое',xp:30}];
const PET_FORMS=[{level:1,icon:'♟️',name:'Пешка'},{level:5,icon:'♞',name:'Конь'},{level:10,icon:'♝',name:'Слон'},{level:15,icon:'♜',name:'Ладья'},{level:20,icon:'♛',name:'Ферзь'},{level:25,icon:'♚',name:'Король'}];

let petEffect='';

function petStage(level=S.pet.level){
  let stage=PET_FORMS[0];for(const form of PET_FORMS){if(level>=form.level)stage=form}return stage
}
function initPet(){
  if(!S.pet||typeof S.pet!=='object')S.pet={name:'Пешка',level:1,xp:0,lastDate:'',done:[]};
  S.pet.name=S.pet.name||'Пешка';
  S.pet.level=Math.max(1,Number(S.pet.level)||1);
  S.pet.xp=Math.max(0,Number(S.pet.xp)||0);
  if(!Array.isArray(S.pet.done))S.pet.done=[];
  const todayKey=fmt(today());
  if(S.pet.lastDate!==todayKey){S.pet.lastDate=todayKey;S.pet.done=[];save()}
}
function petTask(id){
  initPet();
  const task=PET_TASKS.find(x=>x.id===id);
  if(!task||S.pet.done.includes(id))return;

  const oldStage=petStage(S.pet.level);
  S.pet.done.push(id);
  S.pet.xp+=task.xp;

  let levelUps=0;
  while(S.pet.xp>=100){S.pet.xp-=100;S.pet.level++;levelUps++}

  const newStage=petStage(S.pet.level);
  petEffect=levelUps>0?'level-pop':'xp-pop';

  save();
  buzz('medium');
  playSound(levelUps>0?'level':'success');

  render();

  setTimeout(()=>{
    petEffect='';
    const face=document.querySelector('.petface');
    if(face)face.classList.remove('xp-pop','level-pop');
  },900);

  if(newStage.level>oldStage.level){
    note(`🎉 ЭВОЛЮЦИЯ!\n\nТвой питомец превратился в ${newStage.name} ${newStage.icon}!\n\nУровень: ${S.pet.level}`);
  }else if(levelUps>0){
    note(`🎉 Новый уровень!\n\nУровень питомца: ${S.pet.level}\nФорма: ${newStage.name} ${newStage.icon}`);
  }
}
function renamePet(){ask('Имя питомца',S.pet.name,'Сохранить',v=>{v=v.trim();if(v){S.pet.name=v.slice(0,24);save();render()}},24)}

  return `<h1>Мой питомец 🐾</h1><div class="card pet"><div class="mut">ТВОЙ СПУТНИК</div><div class="petface ${petEffect}">${stage.icon}</div><h2>${esc(p.name)}</h2><div class="tag">${stage.name.toUpperCase()}</div><div class="mut">Уровень ${p.level}</div><div class="petbar"><i style="width:${xpProgress}%"></i></div><b>${p.xp} / 100 XP</b><div class="mut">До следующего уровня</div><button class="btn ghost w" onclick="renamePet()">✏️ Изменить имя</button></div>
<div class="card"><h2>♟️ Эволюция питомца</h2>${PET_FORMS.map(f=>{const unlocked=p.level>=f.level,current=stage.level===f.level;return `<div class="ach ${unlocked?'':'lock'}"><div class="achico">${unlocked?f.icon:'🔒'}</div><div style="flex:1"><b>${f.name}</b><div class="mut">Уровень ${f.level}</div>${current?'<div class="tag">ТЕКУЩАЯ ФОРМА</div>':''}</div>${unlocked?'<span class="tag">ОТКРЫТО</span>':'<span class="mut">ЗАКРЫТО</span>'}</div>`}).join('')}${nextStage?`<div style="margin-top:14px"><b>Следующая эволюция</b><div class="mut">${nextStage.icon} ${nextStage.name} · уровень ${nextStage.level}</div><div class="petbar"><i style="width:${evolutionProgress}%"></i></div><div class="mut">${evolutionProgress}% до новой формы</div></div>`:`<div class="pet" style="padding:16px"><div style="font-size:35px">👑</div><b>Максимальная эволюция!</b><div class="mut">Твой питомец стал королём!</div></div>`}</div>

function ask(title,val,okText,cb,max){
  let s=document.createElement('div');s.className='sheet';s.onclick=e=>{if(e.target===s)s.remove()};
  s.innerHTML=`<div><h1 style="margin-top:0">${title}</h1><input type="text" id="ask" ${max?`maxlength="${max}"`:''} value="${esc(val)}"><button class="btn w" id="askok">${okText}</button><button class="btn ghost w" id="askno">Отмена</button></div>`;
  document.body.appendChild(s);
  let i=s.querySelector('#ask');
  s.querySelector('#askno').onclick=()=>s.remove();
  s.querySelector('#askok').onclick=()=>{let v=i.value;s.remove();cb(v)};
  setTimeout(()=>{try{i.focus();i.select()}catch(e){}},50)
}
function rename(){ask('Ваше имя',S.name||(tg?.initDataUnsafe?.user?.first_name||''),'Сохранить',v=>{S.name=v.trim();save();render()},30)}
function exportData(){
  let v=JSON.stringify(S),p;
  try{p=navigator.clipboard.writeText(v)}catch(e){p=Promise.reject()}
  p.then(()=>note('Копия в буфере обмена')).catch(()=>ask('Выделите и скопируйте текст',v,'Закрыть',()=>{}))
}
function importData(){
  ask('Вставьте резервную копию','','Восстановить',v=>{
    if(!v)return;
    try{
      S=Object.assign({habits:[],log:{},mood:{},name:'',avatar:'',pet:{name:'Пешка',level:1,xp:0,lastDate:'',done:[]}},JSON.parse(v));
      initPet();save();render()
    }catch(e){note('Не удалось прочитать копию')}
  })
}
function resetAll(){
  sure('Удалить все привычки и историю?',()=>{
    S={habits:[],log:{},mood:{},name:'',avatar:'',pet:{name:'Пешка',level:1,xp:0,lastDate:'',done:[]}};
    save();render()
  })
}

function openEdit(id){
  let old=S.habits.find(h=>h.id===id),d=old?{...old,days:[...old.days]}:{emoji:'⭐',name:'',color:COLORS[0],days:[0,1,2,3,4,5,6],goal:1},s=document.createElement('div');
  s.className='sheet';s.onclick=e=>{if(e.target===s)s.remove()};
  const paint=()=>{
    s.innerHTML=`<div><h1 style="margin-top:0">${old?'Изменить привычку':'Новая привычка'}</h1>${old?'':`<div class="pre">${PRESETS.map((p,i)=>`<button data-p="${i}">${p[0]} ${p[1]}</button>`).join('')}</div>`}<input type="text" id="nm" maxlength="30" placeholder="Название" value="${esc(d.name)}"><input type="text" id="em" maxlength="4" placeholder="Эмодзи" value="${esc(d.emoji)}"><div class="pre">${COLORS.map(c=>`<button class="sw ${c===d.color?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div><h2>Повторять</h2><div class="pre">${DAYS.map((n,i)=>`<button class="${d.days.includes(i)?'on':''}" data-d="${i}">${n}</button>`).join('')}</div><h2>Раз в день</h2><div class="step"><button data-g="-1">−</button><b>${d.goal}</b><button data-g="1">+</button></div><div id="err" style="color:#d33;min-height:20px;font-size:14px"></div><button class="btn w" id="ok">Сохранить</button>${old?'<button class="btn ghost w" id="rm">Удалить привычку</button>':''}</div>`;
    const keep=()=>{d.name=$('#nm').value;d.emoji=$('#em').value||'⭐'};
    s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{let p=PRESETS[b.dataset.p];d.emoji=p[0];d.name=p[1];d.goal=p[2];paint()});
    s.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{keep();d.color=b.dataset.c;paint()});
    s.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{keep();let i=+b.dataset.d;d.days=d.days.includes(i)?d.days.filter(x=>x!==i):[...d.days,i].sort();paint()});
    s.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{keep();d.goal=Math.min(99,Math.max(1,d.goal+ +b.dataset.g));paint()});
    $('#ok').onclick=()=>{
      keep();d.name=d.name.trim();
      if(!d.name)return $('#err').textContent='Введите название привычки';
      if(!d.days.length)return $('#err').textContent='Выберите хотя бы один день';
      if(old)Object.assign(old,d);else S.habits.push({...d,id:'h'+Date.now()});
      s.remove();save();render()
    };
    if(old)$('#rm').onclick=()=>sure('Удалить привычку и её историю?',()=>{
      S.habits=S.habits.filter(h=>h.id!==id);
      Object.keys(S.log).forEach(k=>setCnt(k,id,0));
      save();s.remove();render()
    })
  };
  document.body.appendChild(s);paint()
}

// Начальный экран
function showGate(){
  $('#app').style.display='none';
  $('#nav').style.display='none';
  $('#adBanner').style.display='none';
  $('#gate').style.display='flex'
}
function showApp(){
  $('#gate').style.display='none';
  $('#app').style.display='block';
  $('#nav').style.display='flex';
  $('#adBanner').style.display='block';
  if(!window.__appLoaded){
    window.__appLoaded=true;
    load(()=>{initPet();render()})
  }
}
$('#continueBtn').addEventListener('click',showApp);
showGate();
</script>
