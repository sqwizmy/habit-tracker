<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои привычки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--tg-theme-bg-color,#f5f5f5); color:var(--tg-theme-text-color,#222); padding:16px; }
h1 { font-size:22px; margin-bottom:12px; }
.add-row { display:flex; gap:8px; margin-bottom:16px; }
input { flex:1; padding:12px; border:1px solid var(--tg-theme-hint-color,#ccc); border-radius:10px; font-size:16px; background:var(--tg-theme-secondary-bg-color,#fff); color:inherit; }
button.add { padding:12px 18px; border:none; border-radius:10px; font-size:16px; background:var(--tg-theme-button-color,#2ea6ff); color:var(--tg-theme-button-text-color,#fff); }
.habit { display:flex; align-items:center; gap:12px; background:var(--tg-theme-secondary-bg-color,#fff); border-radius:12px; padding:14px; margin-bottom:10px; }
.check { width:28px; height:28px; border-radius:50%; border:2px solid var(--tg-theme-hint-color,#bbb); display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; cursor:pointer; flex-shrink:0; }
.done .check { background:#34c759; border-color:#34c759; }
.info { flex:1; }
.name { font-size:16px; }
.done .name { text-decoration:line-through; opacity:.6; }
.streak { font-size:13px; opacity:.6; margin-top:2px; }
.del { background:none; border:none; font-size:18px; opacity:.4; }
.empty { text-align:center; opacity:.5; margin-top:40px; }
</style>
</head>
<body>
<h1>Мои привычки</h1>
<div class="add-row">
  <input id="input" placeholder="Новая привычка…" maxlength="40">
  <button class="add" onclick="addHabit()">+</button>
</div>
<div id="list"></div>
<div class="empty" id="empty">Загружаю…</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Привязка данных к пользователю Telegram
const uid = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 'guest';
const cs = (tg.CloudStorage && tg.CloudStorage.setItem) ? tg.CloudStorage : null;
const MAX_DAYS = 80; // сколько последних дней храним на привычку

const fmt = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = fmt(new Date());
const cutoff = () => { const d = new Date(); d.setDate(d.getDate()-100); return fmt(d); };

let habits = []; // {name: '...', days: ['2026-11-21', ...]}

// Локальная копия — для просмотра в обычном браузере
function lsRead(){ try { return JSON.parse(localStorage.getItem('ht_'+uid) || '[]'); } catch(e){ return []; } }
function lsWrite(){ try { localStorage.setItem('ht_'+uid, JSON.stringify(habits)); } catch(e){} }

// Загрузка из облака Telegram (основное хранилище)
function loadAll(cb){
  if (!cs) { habits = lsRead(); cb(); return; }
  habits = []; let i = 0; let fromCloud = false;
  (function next(){
    cs.getItem('h'+i, function(err, val){
      if (!err && val) {
        const p = val.split('|');
        habits.push({ name: p[0], days: p[1] ? p[1].split(',').filter(Boolean) : [] });
        fromCloud = true; i++; next();
      } else {
        // в облаке пусто, но локально что-то есть — переносим в облако
        if (!fromCloud) { habits = lsRead(); if (habits.length) saveAll(); }
        cb();
      }
    });
  })();
}

// Упаковка привычки в строку "имя|дата,дата,дата" (влезает в лимит облака)
function pack(h){ return h.name + '|' + h.days.filter(d => d >= cutoff()).sort().slice(-MAX_DAYS).join(','); }
function saveOne(i){ if (cs) cs.setItem('h'+i, pack(habits[i])); lsWrite(); }
function saveAll(){
  if (cs) {
    habits.forEach((h,i) => cs.setItem('h'+i, pack(h)));
    cs.removeItem('h'+habits.length); // убираем лишний ключ после удаления
  }
  lsWrite();
}

// Серия: сколько дней подряд отмечено, считая от сегодня назад
function streak(days){
  const set = new Set(days);
  let s = 0; const d = new Date();
  while (set.has(fmt(d))) { s++; d.setDate(d.getDate()-1); }
  return s;
}

function render(){
  const empty = document.getElementById('empty');
  if (!habits.length) {
    empty.style.display = 'block';
    empty.textContent = 'Пока пусто. Добавьте первую привычку!';
  } else empty.style.display = 'none';
  const list = document.getElementById('list');
  list.innerHTML = '';
  habits.forEach(function(h, i){
    const s = streak(h.days);
    const done = h.days.indexOf(today) !== -1;
    const row = document.createElement('div');
    row.className = 'habit' + (done ? ' done' : '');
    row.innerHTML =
      '<div class="check">' + (done ? '✓' : '') + '</div>' +
      '<div class="info"><div class="name">' + esc(h.name) + '</div>' +
      '<div class="streak">🔥 ' + s + ' ' + plural(s) + ' подряд</div></div>' +
      '<button class="del">✕</button>';
    row.querySelector('.check').onclick = function(){ toggle(i); };
    row.querySelector('.del').onclick = function(e){ e.stopPropagation(); del(i); };
    list.appendChild(row);
  });
}

// Защита от ввода символов вроде < в названии
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function plural(n){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'день';
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'дня';
  return 'дней';
}

function addHabit(){
  const input = document.getElementById('input');
  const name = input.value.trim();
  if (!name) return;
  habits.push({ name: name, days: [] });
  saveOne(habits.length - 1);
  input.value = '';
  render();
}

function toggle(i){
  const k = habits[i].days.indexOf(today);
  if (k !== -1) habits[i].days.splice(k, 1); else habits[i].days.push(today);
  saveOne(i);
  render();
  if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function del(i){
  habits.splice(i, 1);
  saveAll();
  render();
}

document.getElementById('input').addEventListener('keydown', function(e){ if (e.key === 'Enter') addHabit(); });

loadAll(render);
</script>
</body>
</html>
