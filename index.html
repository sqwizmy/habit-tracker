function startPetTask(id){
 initPet();if(S.pet.activeTask)return note('Сначала дождись завершения текущего задания!');

function finishPetTask(){
 const activeTask=S.pet.activeTask;if(!activeTask)return;
 const task=PET_TASKS.find(x=>x.id===activeTask.id);
 if(!task){S.pet.activeTask=null;save();render();return}
 if(S.pet.done.includes(task.id)){S.pet.activeTask=null;save();render();return}
 S.pet.done.push(task.id);S.pet.xp+=task.xp;S.pet.activeTask=null;S.shop.coins+=5;
 let ups=0;while(S.pet.xp>=100){S.pet.xp-=100;S.pet.level++;ups++}
 const stage=petStage();petEffect='pop';save();
 if(petTimerInterval){clearInterval(petTimerInterval);petTimerInterval=null}
 playSound(ups?'level':'reward');buzz('medium');render();
 if(ups){celebrate();setTimeout(()=>note('🎉 Новый уровень питомца: '+S.pet.level+' · '+stage.name),250)}
 note('🎉 Задание завершено! +'+task.xp+' XP и +5 🪙');

}
function renderPetTimer(){
 const a=S.pet.activeTask;if(!a)return;
 const task=PET_TASKS.find(x=>x.id===a.id);if(!task)return;
 const left=a.endsAt-Date.now(),total=task.duration*1000,passed=Math.min(total,Math.max(0,total-left));
 const timer=$('#petTimer'),progress=$('#petTaskProgress');
 if(timer)timer.textContent=formatTaskTime(left);
 if(progress)progress.style.width=Math.min(100,Math.max(0,passed/total*100))+'%';
 if(left<=0){if(petTimerInterval){clearInterval(petTimerInterval);petTimerInterval=null}finishPetTask()}
}
function startPetTimer(){

 if(!S.pet.activeTask)return;

function changeAvatar(){
 const picker=document.createElement('input');
 picker.type='file';
 picker.accept='image/*';
 picker.onchange=()=>{
  const file=picker.files?.[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){
   note('Выбери изображение.');
   return;
  }
  if(file.size>5*1024*1024){
   note('Размер изображения не должен превышать 5 МБ.');
   return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement('canvas');
    const max=400;
    const scale=Math.min(1,max/Math.max(img.width,img.height));
    canvas.width=Math.round(img.width*scale);
    canvas.height=Math.round(img.height*scale);
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    S.avatar=canvas.toDataURL('image/jpeg',0.82);
    save();
    render();
    note('Аватар успешно изменён! 💜');
   };
   img.onerror=()=>note('Не удалось открыть изображение.');
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 };
 picker.click();
}

  const hn=Object.entries(S.notes[k]||{}).map(([id,t])=>{const h=S.habits.find(x=>x.id===id);if(!h)return '';return `<div class="row"><div style="flex:1"><b>${h.emoji} ${esc(h.name)}</b><span class="nt">${esc(t)}</span></div><button class="ed" onclick="editNote('${k}','${id}')">✏️</button></div>`}).join('');
  return mn||hn?`<div class="card"><h2>${title}</h2>${mn}${hn}</div>`:'';
 }).join('');
 return `<button class="btn ghost" onclick="go('home')">‹ Назад</button><h1>📓 Дневник заметок</h1>${body||'<div class="card empty">📓<br>Пока нет заметок. Добавь их кнопкой 📝 у привычки или под настроением на главной.</div>'}`;
}
/* --- Поделиться --- */
function shareTG(text,url){
 const link='https://t.me/share/url?url='+encodeURIComponent(url||appLink())+'&text='+encodeURIComponent(text);
 try{if(tg?.openTelegramLink)tg.openTelegramLink(link);else window.open(link,'_blank')}catch(e){window.open(link,'_blank')}
 withAch(()=>{S.shares++});
}
function shareQuote(){shareTG('💜 «'+todayQuote()+'»\n— FocusOnMe',refLink())}
function shareFavQuote(i){const q=S.favQuotes[i];if(q)shareTG('💜 «'+q+'»\n— FocusOnMe',refLink())}
function shareAch(id){const a=ACH.find(x=>x.id===id);if(a)shareTG('🏆 Я открыл достижение «'+a.name+'» '+a.icon+' в FocusOnMe!',refLink())}
function shareProgress(){
 const best=Math.max(0,...S.habits.map(streak));
 shareTG('💜 Мой прогресс в FocusOnMe:\n✅ Выполнено привычек: '+completed()+'\n🔥 Лучшая серия: '+best+' дн.\n🐾 Уровень питомца: '+S.pet.level+'\n🏆 Достижений: '+achCount()+'/'+ACH.length,refLink());
}
/* --- Рефералы --- */
function applyRef(code){
 code=String(code||'').trim().replace(/^ref_/,'');
 if(!code)return note('Введи код друга');
 if(S.ref.by)return note('Ты уже использовал код приглашения.');
 if(code===S.ref.code)return note('Нельзя использовать свой код.');
 withAch(()=>{S.ref.by=code;S.shop.coins+=INVITEE_BONUS});
 note('🎁 Бонус за приглашение: +'+INVITEE_BONUS+' 🪙');
 if(REF_API){try{fetch(REF_API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({referrer:code,user:S.ref.code})}).catch(()=>{})}catch(e){}}
}
function handleStartParam(){
 const p=tg?.initDataUnsafe?.start_param;
 if(p&&String(p).startsWith('ref_')&&!S.ref.by&&String(p).slice(4)!==S.ref.code)applyRef(p);
}
async function syncRef(){
 if(!REF_API)return;
 try{const r=await fetch(REF_API+'/count?code='+encodeURIComponent(S.ref.code));const d=await r.json();const n=Number(d.invited);if(Number.isFinite(n)&&n>S.ref.invited){withAch(()=>{S.ref.invited=n})}}catch(e){}
}
function enterRefCode(){ask('Код друга','',v=>applyRef(v),40)}
function copyRef(){
 const v=refLink();
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(v).then(()=>note('Ссылка скопирована')).catch(()=>ask('Скопируй ссылку',v,()=>{},300));
 else ask('Скопируй ссылку',v,()=>{},300);
}
function shareInvite(){
 if(!botReady())return note('Сначала укажи BOT_USERNAME в коде приложения.');
 shareTG('💜 Присоединяйся к FocusOnMe — трекер привычек с питомцем! Получи +'+INVITEE_BONUS+' 🪙 по моей ссылке.',refLink());
}
function claimRef(n){
 const r=REF_REWARDS.find(x=>x.n===n);if(!r||S.ref.invited<n||S.ref.claimed.includes(n))return;
 withAch(()=>{S.ref.claimed.push(n);S.shop.coins+=r.coins});
 celebrate();note('Награда получена: '+r.coins+' 🪙');
}
function vRef(){
 const r=S.ref;
 return `<button class="btn ghost" onclick="go('home')">‹ Назад</button><h1>👥 Пригласить друзей</h1>
 <div class="card"><h2>Твоя ссылка</h2><div class="mut">Друг получит +${INVITEE_BONUS} 🪙 при входе по ссылке, а ты — награды за приглашённых.</div><div class="quote" style="font-size:13px;word-break:break-all;margin-top:10px">${esc(refLink())}</div><div class="mut" style="margin-top:8px">Твой код: <b>${esc(r.code)}</b></div><button class="btn w" onclick="shareInvite()">📤 Отправить в Telegram</button><button class="btn ghost w" onclick="copyRef()">📋 Скопировать ссылку</button></div>
 <div class="card"><h2>Награды за друзей · приглашено ${r.invited}</h2>${REF_REWARDS.map(x=>{const done=r.invited>=x.n,got=r.claimed.includes(x.n);return `<div class="row"><div style="flex:1"><b>👤 ${x.n} ${x.n===1?'друг':x.n<5?'друга':'друзей'}</b><div class="bar"><i style="width:${Math.round(Math.min(r.invited,x.n)/x.n*100)}%"></i></div><div class="mut">${Math.min(r.invited,x.n)}/${x.n} · награда ${x.coins} 🪙</div></div><button class="btn ${got?'ghost':''}" ${!done||got?'disabled':''} onclick="claimRef(${x.n})">${got?'Получено':done?'Забрать':'В процессе'}</button></div>`}).join('')}</div>
 <div class="card"><h2>Меня пригласили</h2>${r.by?`<div class="mut">Ты уже использовал код приглашения ✓</div>`:`<div class="mut">Есть код друга? Введи его и получи +${INVITEE_BONUS} 🪙.</div><button class="btn ghost w" onclick="enterRefCode()">Ввести код друга</button>`}</div>`;
}
[
 ['n01','📝','Первая заметка','Добавь заметку к привычке',1,()=>notesTotal()],
 ['n02','🗒️','Записная книжка','Добавь 10 заметок к привычкам',10,()=>notesTotal()],
 ['n03','📓','Летописец','Добавь 50 заметок к привычкам',50,()=>notesTotal()],
 ['n04','💭','Мысли о дне','Добавь заметку к настроению',1,()=>moodNotesTotal()],
 ['n05','📔','Личный дневник','Добавь 10 заметок к настроению',10,()=>moodNotesTotal()],
 ['n06','📖','Хранитель эмоций','Добавь 30 заметок к настроению',30,()=>moodNotesTotal()],
 ['s01','📤','Поделился','Поделись чем-нибудь в Telegram',1,()=>S.shares],
 ['s02','📣','Рассказчик','Поделись 5 раз',5,()=>S.shares],
 ['s03','🌐','Амбассадор','Поделись 20 раз',20,()=>S.shares],
 ['r01','🎉','По приглашению','Присоединись по коду друга',1,()=>S.ref.by?1:0],
 ['r02','🤝','Первый друг','Пригласи 1 друга',1,()=>S.ref.invited],
 ['r03','👥','Компания','Пригласи 3 друзей',3,()=>S.ref.invited],
 ['r04','🎈','Душа компании','Пригласи 5 друзей',5,()=>S.ref.invited],
 ['r05','🌟','Лидер сообщества','Пригласи 10 друзей',10,()=>S.ref.invited]
].forEach(([id,icon,name,desc,goal,val])=>ACH.push({id,icon,name,desc,goal,val}));

/* ===== СЕКРЕТНЫЕ ДОСТИЖЕНИЯ, ФОНЫ И СКИНЫ ===== */
const BGS=[
 {id:'default',name:'Фиолетовый',css:'radial-gradient(ellipse at top,#211033 0,#090611 55%)'},
 {id:'dusk',name:'Сумерки',css:'radial-gradient(ellipse at top,#4a1d57 0,#1a0b2e 45%,#07040d 100%)'},
 {id:'aurora',name:'Аврора',css:'linear-gradient(160deg,#07131f 0,#0f3d3a 40%,#3b1a6b 80%,#090611 100%)'},
 {id:'cosmos',name:'Космос',css:'radial-gradient(circle at 20% 15%,#4b1d8f 0,transparent 35%),radial-gradient(circle at 80% 70%,#0d4d7a 0,transparent 40%),#04020a'}
];
const SKINS=[
 {id:'default',name:'Классический',filter:''},
 {id:'neon',name:'Неон',filter:'hue-rotate(120deg) saturate(1.6) drop-shadow(0 0 17px #3bffb0)'},
 {id:'gold',name:'Золотой',filter:'sepia(1) saturate(4) hue-rotate(-10deg) drop-shadow(0 0 17px #ffd77b)'},
 {id:'cosmic',name:'Космический',filter:'hue-rotate(200deg) saturate(2) drop-shadow(0 0 20px #5ad0ff)'}
];
function applyLook(){const b=BGS.find(x=>x.id===S.look.bg)||BGS[0];document.body.style.background=b.css;document.body.style.backgroundAttachment='fixed'}
function skinFilter(){const k=SKINS.find(x=>x.id===S.look.skin);return k&&k.filter?'filter:'+k.filter:''}
function rewardText(r){r=r||{};const a=[];if(r.coins)a.push('+'+r.coins+' 🪙');if(r.bg)a.push('фон «'+BGS.find(x=>x.id===r.bg).name+'»');if(r.skin)a.push('скин «'+SKINS.find(x=>x.id===r.skin).name+'»');return a.join(', ')}
function setBg(id){if(S.look.bgs.includes(id)){S.look.bg=id;save();render()}}
function setSkin(id){if(S.look.skins.includes(id)){S.look.skin=id;save();render()}}
function vLook(){
 const lockRow=`<div class="row"><span>🔒 Скрыто</span><span class="mut">Секретная награда</span></div>`;
 const bgs=BGS.map(x=>S.look.bgs.includes(x.id)?`<div class="row"><div style="display:flex;align-items:center;gap:10px"><div style="width:42px;height:42px;border-radius:12px;border:1px solid #68418b;background:${x.css}"></div><b>${x.name}</b></div>${S.look.bg===x.id?'<span class="tag">ВЫБРАНО</span>':`<button class="btn ghost" onclick="setBg('${x.id}')">Выбрать</button>`}</div>`:lockRow).join('');
 const skins=SKINS.map(x=>S.look.skins.includes(x.id)?`<div class="row"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:30px;width:42px;text-align:center;${x.filter?'filter:'+x.filter:''}">${petStage().icon}</div><b>${x.name}</b></div>${S.look.skin===x.id?'<span class="tag">ВЫБРАНО</span>':`<button class="btn ghost" onclick="setSkin('${x.id}')">Выбрать</button>`}</div>`:lockRow).join('');
 return `<button class="btn ghost" onclick="go('home')">‹ Назад</button><h1>🎨 Оформление</h1><div class="card"><h2>Фоны</h2>${bgs}</div><div class="card"><h2>Скины питомца</h2>${skins}</div>`;
}
let sxBusy=false;
function grantSecrets(){
 if(sxBusy||!S.sx||!S.look)return;
 const fresh=ACH.filter(a=>a.secret&&a.val()>=a.goal&&!S.sx.got.includes(a.id));
 if(!fresh.length)return;
 sxBusy=true;const lines=[];
 fresh.forEach(a=>{
  S.sx.got.push(a.id);const r=a.reward||{};
  if(r.coins)S.shop.coins+=r.coins;
  if(r.bg&&!S.look.bgs.includes(r.bg))S.look.bgs.push(r.bg);
  if(r.skin&&!S.look.skins.includes(r.skin))S.look.skins.push(r.skin);
  lines.push(a.icon+' '+a.name+' — '+rewardText(r));
 });
 save();
 setTimeout(()=>{sxBusy=false;celebrate();note('🕵️ Секретное достижение!\n'+lines.join('\n'));render()},300);
}
function dayCounts(){
 return Object.keys(S.log).map(k=>{
  const d=new Date(k+'T00:00:00'),hs=S.habits.filter(h=>active(h,d)),done=S.habits.filter(h=>ok(k,h)).length;
  return {planned:hs.length,allDone:hs.length>0&&hs.every(h=>ok(k,h)),done};
 });
}
function maxNoteLen(){
 const a=[];Object.values(S.notes).forEach(o=>Object.values(o).forEach(t=>a.push(String(t).length)));
 Object.values(S.moodNotes).forEach(t=>a.push(String(t).length));
 return Math.max(0,...a);
}
const SECRETS=[
 ['x01','🦉','Ночная сова','Выполни привычку глубокой ночью (00:00–05:00)',()=>S.sx.night>=1,{coins:100}],
 ['x02','🌅','Ранняя пташка','Выполни привычку на рассвете (05:00–07:00)',()=>S.sx.early>=1,{coins:150}],
 ['x03','🧙','Мудрец','Собери 10 цитат в избранное',()=>S.favQuotes.length>=10,{coins:200}],
 ['x04','🌗','Идеальный день','Выполни все привычки дня, когда их 3 или больше',()=>dayCounts().some(x=>x.planned>=3&&x.allDone),{coins:150,bg:'dusk'}],
 ['x05','✒️','Писатель','Напиши заметку длиннее 200 символов',()=>maxNoteLen()>=200,{coins:250,skin:'neon'}],
 ['x06','🐕','Верный друг','Выполни все 4 задания питомца за один день',()=>S.pet.done.length>=PET_TASKS.length,{coins:400}],
 ['x07','🏃','Марафонец','Держи серию привычки 30 дней',()=>Math.max(0,...S.habits.map(streak))>=30,{coins:500,bg:'aurora'}],
 ['x08','⚡','Десять за день','Выполни 10 привычек за один день',()=>dayCounts().some(x=>x.done>=10),{coins:600,skin:'gold'}],
 ['x09','🏛️','Хранитель привычек','Выполни 500 привычек',()=>completed()>=500,{coins:2000}],
 ['x10','🌌','Легенда FocusOnMe','Открой 60 обычных достижений',()=>ACH.filter(a=>!a.secret&&a.val()>=a.goal).length>=60,{coins:3000,bg:'cosmos',skin:'cosmic'}]
];
SECRETS.forEach(([id,icon,name,desc,f,reward])=>ACH.push({id,icon,name,desc,goal:1,val:()=>f()?1:0,secret:true,reward}));
/* ===== ГОТОВО ===== */

load();$('#app').style.display='none';$('#nav').style.display='none';
</script>
